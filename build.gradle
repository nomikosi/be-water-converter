import org.jetbrains.changelog.Changelog
import org.jetbrains.intellij.platform.gradle.IntelliJPlatformType
import org.jetbrains.intellij.platform.gradle.models.ProductRelease
import org.jetbrains.intellij.platform.gradle.tasks.PrepareSandboxTask

plugins {
    id 'java'
    id 'jacoco'
    id 'org.jetbrains.intellij.platform' version '2.19.0'
    id 'org.jetbrains.changelog' version '2.5.0'
}

group = 'com.converter'
version = '1.6.0'

// Declared before anything else in the script: the IntelliJ Platform plugin
// reads the toolchain while it configures tasks, and a value once read can
// no longer be set.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

configurations {
    kotlinCompiler
    lombokProcessor
    kotlinJackson
    // The IDE bundles protobuf-java 3.24 as lib/protobuf.jar, which comes first
    // on the test classpaths and would shadow the 4.x the payload tests check
    // the decoder against. These two jars go ahead of it: see compileTestJava.
    protobufOracle { transitive = false }
}

def jacksonBom = 'com.fasterxml.jackson:jackson-bom:2.22.3'

dependencies {
    intellijPlatform {
        intellijIdeaCommunity('2025.1.7.1')
    }

    // The BOM gives every Jackson module one version, so they cannot drift apart.
    implementation platform(jacksonBom)
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-csv'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-toml'
    // The YAML reader is built on SnakeYAML's own classes, not only Jackson's,
    // so it is a direct dependency: the version jackson-dataformat-yaml uses.
    implementation 'org.yaml:snakeyaml:2.7'
    implementation 'com.fifesoft:rsyntaxtextarea:4.0.1'
    // Isolated from both the plugin and the IDE test class loader. Tests invoke
    // this compiler in a separate JVM and load the resulting classes.
    kotlinCompiler 'org.jetbrains.kotlin:kotlin-compiler-embeddable:2.1.20'
    lombokProcessor 'org.projectlombok:lombok:1.18.48'
    // Binds the compiled Kotlin data classes the way their users will, in an
    // isolated class loader: a class that compiles can still fail to read its JSON.
    kotlinJackson platform(jacksonBom)
    kotlinJackson 'com.fasterxml.jackson.module:jackson-module-kotlin'
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    // Parameterised tests: routing tables are covered per-format rather than by
    // one test per arm, which is what let several arms go untested.
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    // Generated classes type dates as java.time, which plain Jackson refuses
    // to bind; the tests read them the way a user of that output has to.
    testImplementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    // Google's own Protobuf runtime, to check the payload decoder against: it
    // encodes the payloads the tests decode, and its JsonFormat prints what a
    // payload holds from a descriptor built in the test. Never bundled.
    testImplementation 'com.google.protobuf:protobuf-java:4.36.2'
    testImplementation 'com.google.protobuf:protobuf-java-util:4.36.2'
    protobufOracle 'com.google.protobuf:protobuf-java:4.36.2'
    protobufOracle 'com.google.protobuf:protobuf-java-util:4.36.2'
    // JUnit 4 is required at runtime by the IntelliJ platform test executor,
    // even though every test is a JUnit Jupiter test.
    testRuntimeOnly 'junit:junit:4.13.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('compileTestJava') {
    classpath = configurations.protobufOracle + classpath
}

test {
    useJUnitPlatform()
    jvmArgs '-Dfile.encoding=UTF-8'
    include '**/*Test.class'
    // These check the decoder against protobuf-java 4, which the IDE's own
    // protobuf 3 shadows on this JVM; unitTest runs them, with 4 first.
    exclude 'com/converter/core/ProtoPayloadDecoderTest*'
    exclude 'com/converter/core/ProtoPayloadCrossCheckTest*'
    // No coverage agent on the IntelliJ-platform test JVM; coverage comes
    // from the plain-JVM unitTest task instead.
    jacoco { enabled = false }
}

changelog {
    // A release lists its changes directly, without Added and Fixed subheadings.
    groups.empty()
}

intellijPlatform {
    pluginConfiguration {
        version = project.version
        // Searches rank a plugin by the words in its name first, so the name
        // says what it converts. JetBrains allows 30 characters.
        name = 'Be Water JSON YAML Converter'
        // Every release's notes from CHANGELOG.md, newest first. get() fails the
        // build while this version has no section there, so a release cannot go
        // out with the previous release's notes.
        changeNotes = provider {
            def changelog = project.changelog
            changelog.get(project.version.toString())
            changelog.instance.get().releasedItems.collect { release ->
                "<h3>${release.version}</h3>\n" + changelog.renderItem(release.withHeader(false), Changelog.OutputType.HTML)
            }.join('\n')
        }
        ideaVersion {
            // 251 (2025.1) is the first build with the non-deprecated
            // FileSaverDescriptor(title, description, extension) constructor.
            sinceBuild = '251'
        }
    }
    pluginVerification {
        ides {
            // Pinned explicitly rather than left to recommended(): its result
            // depends on the Gradle plugin version (2.16.0 scheduled five IDEs,
            // 2.18.1 only two), so coverage would silently shrink on upgrade.
            // Split by type rather than listing both across the whole range:
            // 2025.1 and 2025.2 are published under BOTH codes, so a combined
            // filter verified those two builds twice — about 6 minutes per
            // release tag for no extra surface, since the plugin depends only
            // on com.intellij.modules.platform.
            select { filter ->
                filter.types.set([IntelliJPlatformType.IntellijIdeaCommunity])
                filter.channels.set([ProductRelease.Channel.RELEASE])
                filter.sinceBuild.set('251')
                filter.untilBuild.set('252.*')
            }
            // From 2025.3 IntelliJ IDEA ships as one unified distribution,
            // listed only under Ultimate.
            select { filter ->
                filter.types.set([IntelliJPlatformType.IntellijIdeaUltimate])
                filter.channels.set([ProductRelease.Channel.RELEASE])
                filter.sinceBuild.set('253')
                filter.untilBuild.set('262.*')
            }
        }
    }
    publishing {
        // Set by the release workflow; create the token at
        // https://plugins.jetbrains.com/author/me/tokens
        token = providers.environmentVariable('PUBLISH_TOKEN')
    }
}

// ── Unit test task — plain JVM, no IDE sandbox ─────────────────────────────
tasks.register('unitTest', Test) {
    description = 'Runs pure unit tests (no IntelliJ platform required).'
    group       = 'verification'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath       = configurations.protobufOracle + sourceSets.test.runtimeClasspath

    useJUnitPlatform()
    jvmArgs '-Dfile.encoding=UTF-8'
    include 'com/converter/**/*Test.class'
    // Exclude before JUnit discovery: tags are evaluated only after loading
    // classes, and these tests require the platform-aware test class loader.
    // The descriptor test loads the plugin's classes, which extend platform types.
    exclude 'com/converter/ConverterPanel*Test.class'
    exclude 'com/converter/ConverterActionsTest.class'
    exclude 'com/converter/FindBarTest.class'
    exclude 'com/converter/PluginDescriptorTest.class'

    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
        showStandardStreams = false
    }

    failFast = false
}

// ── Coverage (pure unit tests only) ────────────────────────────────────────
tasks.register('jacocoUnitTestReport', JacocoReport) {
    description = 'Coverage report for the pure unit tests.'
    group       = 'verification'
    dependsOn tasks.named('unitTest')
    executionData tasks.named('unitTest').get()
    sourceSets sourceSets.main
    reports {
        html.required = true
        xml.required  = true
    }
}
tasks.named('unitTest') { finalizedBy tasks.named('jacocoUnitTestReport') }

// NOTE: 'check' deliberately does NOT depend on unitTest — the 'test' task
// already runs a superset of it, but for the protobuf-java cross-checks, which
// need the plain JVM. CI explicitly runs both JVM environments.

// Make 'build' produce the installable plugin ZIP as well as the Java artifacts.
tasks.named('build') { dependsOn tasks.named('buildPlugin') }

// ── Files that go with a ZIP uploaded by hand ─────────────────────────────
// Its SHA-256, and this version's notes as the IDE will show them: taken from
// the plugin.xml inside the ZIP, not from CHANGELOG.md, so they are the notes
// that were built.
tasks.register('releaseFiles') {
    description = "Writes the plugin ZIP's SHA-256 and this version's release notes (HTML) beside it."
    group = 'distribution'
    def zipFile = tasks.named('buildPlugin').flatMap { it.archiveFile }
    def version = project.version.toString()
    def pluginName = project.name
    // Named from the build directory: the ZIP's own path cannot be queried
    // until buildPlugin has run, and the configuration cache would ask sooner.
    def distributions = layout.buildDirectory.dir('distributions')
    def shaFile = distributions.map { it.file("${pluginName}-${version}.zip.sha256") }
    def notesFile = distributions.map { it.file("${pluginName}-${version}-release-notes.html") }
    inputs.file(zipFile)
    outputs.files(shaFile, notesFile)
    doLast {
        File zip = zipFile.get().asFile
        byte[] data = zip.bytes
        String sha = java.security.MessageDigest.getInstance('SHA-256').digest(data).encodeHex().toString()
        shaFile.get().asFile.setText("${sha}  ${zip.name}\n", 'UTF-8')

        String pluginXml = null
        new java.util.zip.ZipInputStream(new ByteArrayInputStream(data)).withCloseable { outer ->
            for (def entry = outer.nextEntry; entry != null; entry = outer.nextEntry) {
                if (entry.name != "${pluginName}/lib/${pluginName}-${version}.jar") continue
                def jar = new java.util.zip.ZipInputStream(new ByteArrayInputStream(outer.readAllBytes()))
                for (def inner = jar.nextEntry; inner != null; inner = jar.nextEntry)
                    if (inner.name == 'META-INF/plugin.xml') pluginXml = new String(jar.readAllBytes(), 'UTF-8')
            }
        }
        if (pluginXml == null) throw new GradleException("${zip.name} holds no plugin.xml")
        def notes = pluginXml =~ /(?s)<h3>${java.util.regex.Pattern.quote(version)}<\/h3>.*?(?=<h3>|\]\]>)/
        if (!notes.find()) throw new GradleException("${zip.name}'s plugin.xml has no notes for ${version}")
        notesFile.get().asFile.setText(
              '<!doctype html>\n<html lang="en"><meta charset="utf-8">'
                    + "<title>Be Water JSON YAML Converter ${version}</title><body>\n${notes.group().trim()}\n</body></html>\n",
              'UTF-8')
        logger.lifecycle("${zip.name}: ${String.format(Locale.ROOT, '%,d', data.length)} bytes, SHA-256 ${sha}")
    }
}

// ── Suppress missing emojipicker.jar (Windows bug MP-6708) ────────────────
tasks.withType(PrepareSandboxTask).configureEach {
    disabledPlugins.add("org.jetbrains.plugins.emojipicker")
}

// ── Serialise the two instrumentation tasks ───────────────────────────────
// With the configuration cache on, Gradle runs a project's tasks in parallel,
// and instrumentCode and instrumentTestCode share the platform plugin's
// instrumenter. Run together they failed intermittently with a
// ConcurrentModificationException or a bare "1 >= 1" from inside it.
tasks.named('instrumentTestCode') {
    mustRunAfter tasks.named('instrumentCode')
}


tasks.withType(Test).configureEach {
    systemProperty 'bewater.kotlin.compiler.classpath', configurations.kotlinCompiler.asPath
    systemProperty 'bewater.lombok.classpath', configurations.lombokProcessor.asPath
    systemProperty 'bewater.kotlin.jackson.classpath', configurations.kotlinJackson.asPath
    systemProperty 'bewater.test.classpath', sourceSets.test.runtimeClasspath.asPath
    systemProperty 'bewater.javac', javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(21)
    }.get().executablePath.asFile.absolutePath
    // IntelliJ's test class loader does not expose a usable CodeSource URL.
    systemProperty 'bewater.jackson.annotations.classpath', configurations.testRuntimeClasspath.filter {
        it.name.startsWith('jackson-annotations-')
    }.asPath
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
