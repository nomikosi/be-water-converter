name: Release

# Publishes to JetBrains Marketplace when a v* tag is pushed:
#   git tag v1.5.3 && git push origin v1.5.3
# Tags without the v (1.5.2) mark releases that were uploaded by hand, and do
# not start this workflow.
# Requires the PUBLISH_TOKEN repository secret (JetBrains Marketplace
# permanent token: https://plugins.jetbrains.com/author/me/tokens).
on:
  push:
    tags: [ 'v*' ]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Pinned to commits, as in build.yml: this job holds the publishing token.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The tag names the release; build.gradle names the plugin version that
      # gets published. Publishing one under the other is not recoverable on
      # the Marketplace, so they have to agree before anything runs.
      - name: Check that the tag matches the plugin version
        run: |
          version=$(sed -n "s/^version = '\(.*\)'$/\1/p" build.gradle)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in build.gradle" >&2
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      # v5, not v6: see build.yml.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Test and build
        run: ./gradlew unitTest check buildPlugin --console=plain

      - name: Verify plugin compatibility
        run: ./gradlew verifyPlugin --console=plain

      - name: Publish to JetBrains Marketplace
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew publishPlugin --console=plain

      - name: Create GitHub release with plugin ZIP
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: build/distributions/*.zip
          generate_release_notes: true
