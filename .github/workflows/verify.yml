name: Verify plugin

# The compatibility check a release runs, without releasing: from the Actions
# tab, every week against the newest IDE builds in the pinned range, and
# whenever what it checks changes. Before this it ran only on a release tag,
# where a failure is the most expensive to discover.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
  push:
    branches: [ master ]
    paths:
      - build.gradle
      - gradle/**
      - src/main/resources/META-INF/plugin.xml
      - .github/workflows/verify.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commits, as in build.yml.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      # Terms of its caching: see build.yml.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # verifyPlugin unpacks every IDE it checks against: about 30 GB.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          large-packages: false
          swap-storage: false

      - name: Verify plugin compatibility
        run: ./gradlew verifyPlugin --console=plain

      - name: Upload verifier reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-verifier-reports
          path: build/reports/pluginVerifier/
          if-no-files-found: ignore
