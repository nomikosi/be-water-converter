name: Verify plugin

# The compatibility check a release runs, without releasing: from the Actions
# tab, every week against the newest IDE builds in the pinned range, and
# whenever what it checks changes. Before this it ran only on a release tag,
# where a failure is the most expensive to discover.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
  push:
    branches: [ master ]
    paths:
      - build.gradle
      - gradle/**
      - src/main/resources/META-INF/plugin.xml
      - .github/workflows/verify.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commits, as in build.yml.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      # Terms of its caching: see build.yml.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # verifyPlugin unpacks every IDE it checks against: about 40 GB with
      # their downloads for the seven in range. The swap file goes too.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          large-packages: false
          swap-storage: true

      - name: Verify plugin compatibility
        run: ./gradlew verifyPlugin --console=plain

      # How close the IDEs came to filling the disk, for when the range grows.
      - name: Disk left
        if: always()
        run: df -h /

      - name: Upload verifier reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-verifier-reports
          path: build/reports/pluginVerifier/
          if-no-files-found: ignore
