name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# The build only reads the repository. Artifact uploads use their own runtime
# token, not this one.
permissions:
  contents: read

# A new push to a pull request supersedes the build still running for it.
# Builds of master all run to the end, so every commit there keeps a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commits, which cannot be moved the way a tag can.
      # Dependabot updates the commit and the version comment together.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      # v5, not v6: from v6 the caching is a proprietary component under
      # separate terms of use (https://blog.gradle.org/github-actions-for-gradle-v6).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Run tests and build plugin
        run: ./gradlew unitTest check buildPlugin --console=plain

      # Cheap descriptor and project-configuration checks that used to run only
      # on a release tag, where a failure is expensive to discover.
      - name: Verify plugin structure and configuration
        run: ./gradlew verifyPluginStructure verifyPluginProjectConfiguration --console=plain

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-distribution
          path: build/distributions/*.zip
          if-no-files-found: error

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: build/reports/tests/
